name = "geo-seo-system"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ─── Pages configuration ───
# When deploying via `wrangler pages`, the static assets come from Vite's build
# output (dist/public) and the worker script handles /api/* routes.

[vars]
NODE_ENV = "production"

# ─── Hyperdrive: Cloudflare's connection-pool proxy for external databases ───
# After creating the Hyperdrive config, uncomment and fill in the ID:
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<your-hyperdrive-config-id>"

# ─── Secrets (set via `wrangler secret put <NAME>`) ───
# DATABASE_URL        — mysql://user:pass@host:port/db
# JWT_SECRET          — session signing key
# OPENROUTER_API_KEY  — LLM API key
# GOOGLE_CLIENT_ID    — Google OAuth
# GOOGLE_CLIENT_SECRET— Google OAuth
